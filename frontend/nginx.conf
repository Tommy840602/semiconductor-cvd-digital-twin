map $host $cvd_scheme { default http; ~\.trycloudflare\.com$ https; }
server {
 listen 80; root /usr/share/nginx/html;
 location = /oauth/outlook { access_log off; add_header Referrer-Policy "no-referrer" always; add_header Cache-Control "no-store" always; try_files /index.html =404; }
 location / {try_files $uri $uri/ /index.html;}
 location /api/ {proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-CVD-Scheme $cvd_scheme;}
 location /ws {proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_set_header X-CVD-Scheme $cvd_scheme;}
}
