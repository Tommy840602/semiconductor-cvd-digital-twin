    "mqtt": {
      "volumes": [
        {
          "type": "bind",
          "source": "./.runtime/secrets/secs-production/mosquitto.conf",
          "target": "/mosquitto/config/mosquitto.conf",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "./.runtime/secrets/secs-production/passwords",
          "target": "/mosquitto/config/passwords",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "./.runtime/secrets/secs-production/acl",
          "target": "/mosquitto/config/acl",
          "read_only": true
        },
        {
          "type": "volume",
          "source": "mqtt-data",
          "target": "/mosquitto/data"
        }
      ],
      "secrets": [
        {
          "source": "mqtt_health",
          "target": "mqtt_health"
        }
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -u health -P \"$(cat /run/secrets/mqtt_health)\" -t health/mqtt -m ok"
        ],
        "timeout": "3s",
        "interval": "3s",
        "retries": 30
      }
    },
    "simulator": {
      "image": "cvd-secs-simulator",
      "restart": "unless-stopped",
