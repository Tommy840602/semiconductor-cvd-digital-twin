      "image": "cvd-secs-gateway",
      "restart": "unless-stopped",
      "environment": {
        "CVD_PROTOCOL": "secs",
        "HSMS_ENDPOINT": "simulator:5000",
        "OPC_ENDPOINT": null,
        "GOMAXPROCS": "${CVD_GO_PROCS:-1}"
      },
      "secrets": [
