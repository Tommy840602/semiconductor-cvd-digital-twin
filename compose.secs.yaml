    "bridge": {
      "image": "cvd-secs-bridge",
      "environment": {
        "DATA_DIR": "/data",
        "MQTT_URL": "tcp://mqtt:1883",
        "KAFKA_BOOTSTRAP": "kafka:9092"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "bridge-data",
          "target": "/data"
        }
      ],
      "secrets": [
        {
          "source": "control_key",
          "target": "control_key"
        },
        {
          "source": "mqtt_bridge",
          "target": "mqtt_password"
        }
      ],
      "depends_on": {
        "mqtt": {
          "condition": "service_healthy"
        },
        "kafka": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/health"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "build": {
        "context": ".",
        "dockerfile": "bridge/Dockerfile"
      }
    }
