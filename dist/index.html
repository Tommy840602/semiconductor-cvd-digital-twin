<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="工業設備狀態、即時趨勢與告警監控儀表板，使用模擬資料。"><title>PULSE · 工業監控中心</title><link rel="stylesheet" href="style.css"></head><body>
<aside><a class="brand" href="./"><span class="brand-icon">Ⅱ</span>PULSE<span class="brand-small">OPERATIONS</span></a><div class="side-label">工作空間</div><a class="nav active" href="#overview">▦ <span>監控總覽</span></a><a class="nav" href="#equipment">▤ <span>設備狀態</span></a><a class="nav" href="#alarms">♧ <span>告警中心</span></a><div class="side-bottom"><span class="avatar">北</span><div>北區製造中心<small>示範工作空間</small></div></div></aside>
<div class="workspace"><header><span>工作空間 <b>/</b> 監控總覽</span><span class="demo">◉ 模擬資料 · 未連接設備</span></header><main id="overview"><div class="page-heading"><div><div class="eyebrow">PLANT OVERVIEW</div><h1>工業監控中心<span class="live" id="live">模擬運行中</span></h1><p>掌握設備運轉、製程趨勢與異常狀態。</p></div><div class="toolbar"><label class="sr-only" for="line">產線</label><select id="line"><option value="all">全部產線</option><option value="A">A 產線</option><option value="B">B 產線</option></select><button id="pause">Ⅱ 暫停模擬</button></div></div>
<section id="kpis" class="kpis" aria-label="監控摘要"></section>
<div class="main-grid"><section class="panel trend"><div class="panel-heading"><div><h2>即時製程趨勢</h2><p id="chart-sub"></p></div><label><span class="sr-only">時間範圍</span><select id="range"><option value="5">最近 5 分鐘</option><option value="1">最近 1 分鐘</option></select></label></div><div class="metrics" id="metrics"></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 760 245" role="img" aria-label="選定設備即時趨勢"></svg></div><div class="chart-footer"><span><i></i> <span id="legend"></span></span><span id="updated"></span></div></section><section class="panel equipment" id="equipment"><div class="panel-heading"><h2>設備狀態</h2><span id="device-count" class="muted"></span></div><div id="devices"></div><div class="equipment-footer">選取設備以檢視製程趨勢 ↗</div></section></div>
<section class="panel alarms" id="alarms"><div class="panel-heading"><div class="alarm-title"><h2>告警中心</h2><span id="alarm-count" class="count"></span></div><label><span class="sr-only">告警篩選</span><select id="alarm-filter"><option value="pending">未確認告警</option><option value="all">全部告警</option></select></label></div><div class="table-wrap"><table><thead><tr><th>等級</th><th>設備 / 產線</th><th>告警內容</th><th>觸發時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="alarm-rows"></tbody></table></div><div class="alarm-foot">確認代表已讀；設備異常仍需處理。此處操作僅在本次瀏覽有效。</div></section><footer> PULSE / 工業監控 <span>每 2 秒更新 · 模擬模式</span></footer></main></div><div id="toast" role="status"></div><script type="module" src="app.mjs"></script></body></html>
