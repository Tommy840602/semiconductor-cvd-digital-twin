    depends_on:
      simulator-09: {condition: service_healthy}
      mqtt: {condition: service_healthy}
  simulator-10:
    <<: *simulator
    environment:
      EQUIPMENT_ID: TEL-CVDTIN-08A-10
      CVD_RECOVERY_KEY_FILE: /run/secrets/recovery_key
    volumes: [sim-10-data:/data]
  gateway-10:
    <<: *gateway
    environment:
      EQUIPMENT_ID: TEL-CVDTIN-08A-10
      OPC_ENDPOINT: opc.tcp://simulator-10:4840
      MQTT_URL: tcp://mqtt:1883
      DATA_DIR: /data
    volumes: [gateway-10-data:/data]
    depends_on:
      simulator-10: {condition: service_healthy}
      mqtt: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/cvd
      TIMESCALE_URL: jdbc:postgresql://timescaledb:5432/cvd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvd-local}
      MQTT_URL: tcp://mqtt:1883
      MQTT_DATA_DIR: /data/mqtt
      KAFKA_SERVERS: kafka:9092
      REDIS_HOST: redis
      CVD_RECOVERY_KEY_FILE: /run/secrets/recovery_key
      CVD_BOOTSTRAP_PASSWORD_FILE: /run/secrets/leader_password
      CVD_PUBLIC_ORIGIN: ${CVD_PUBLIC_ORIGIN:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      CVD_REPORT_MODEL: ${CVD_REPORT_MODEL:-}
      CVD_REPORT_DIR: /data/reports
      EMAIL_OFFLINE_SECONDS: ${EMAIL_OFFLINE_SECONDS:-60}
      EMAIL_RECOVERY_SECONDS: ${EMAIL_RECOVERY_SECONDS:-10}
    secrets: [leader_password, recovery_key]
    volumes: [backend-data:/data]
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      {
        postgres: { condition: service_healthy },
        timescaledb: { condition: service_healthy },
        kafka: { condition: service_healthy },
        redis: { condition: service_healthy },
        mqtt: { condition: service_healthy },
      }
    healthcheck:
      {
        test: [CMD-SHELL, "wget -qO- http://localhost:8080/actuator/health"],
        interval: 5s,
        timeout: 3s,
        retries: 30,
      }
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:18000:80"]
    depends_on: { backend: { condition: service_healthy } }
volumes:
  pg-data:
  ts-data:
  redis-data:
  mqtt-data:
  kafka-data:
  sim-data:
  gateway-data:
  backend-data:

  sim-02-data:
  gateway-02-data:
  sim-03-data:
  gateway-03-data:
  sim-04-data:
  gateway-04-data:
  sim-05-data:
  gateway-05-data:
  sim-06-data:
  gateway-06-data:
  sim-07-data:
  gateway-07-data:
  sim-08-data:
  gateway-08-data:
  sim-09-data:
  gateway-09-data:
  sim-10-data:
  gateway-10-data:

secrets:
  recovery_key:
    file: ${CVD_RECOVERY_KEY_FILE:-./.runtime/secrets/recovery-key}
  leader_password:
    file: ${CVD_LEADER_PASSWORD_FILE:-./.runtime/secrets/leader-password}
