name: cvd-twin
services:
  postgres:
    image: postgres:16-alpine
    environment: &db-env
      POSTGRES_DB: cvd
      POSTGRES_USER: cvd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvd-local}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: [CMD-SHELL, pg_isready -U cvd],
        interval: 3s,
        timeout: 3s,
        retries: 30,
      }
  timescaledb:
    image: timescale/timescaledb:2.28.2-pg16@sha256:ba149561ad4ddff5940d6eb0a0df60aefd1355cee1a450928f271267038fc888
    environment: *db-env
    volumes: [ts-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: [CMD-SHELL, pg_isready -U cvd],
        interval: 3s,
        timeout: 3s,
        retries: 30,
      }
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      { test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 30 }
  mqtt:
    image: eclipse-mosquitto:2.0
    volumes:
      [
        ./deployment/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,
        mqtt-data:/mosquitto/data,
      ]
    healthcheck:
      {
        test: [CMD-SHELL, "mosquitto_pub -h localhost -t health -m ok"],
        interval: 3s,
        timeout: 3s,
        retries: 30,
      }
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      {
        test:
          [
            CMD-SHELL,
            "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
          ],
        interval: 10s,
        timeout: 10s,
        retries: 30,
      }
  simulator: &simulator
    image: cvd-twin-simulator
    build: {context: ., dockerfile: simulator/Dockerfile}
    environment:
      EQUIPMENT_ID: TEL-CVDTIN-08A-01
      CVD_RECOVERY_KEY_FILE: /run/secrets/recovery_key
    secrets: [recovery_key]
    volumes: [sim-data:/data]
    healthcheck:
      {
        test: [CMD-SHELL, "wget -qO- http://localhost:8081/health"],
        interval: 3s,
        timeout: 3s,
        retries: 30,
      }
  gateway: &gateway
    image: cvd-twin-gateway
    build: {context: ., dockerfile: gateway/Dockerfile}
    environment:
      {
        EQUIPMENT_ID: TEL-CVDTIN-08A-01,
        OPC_ENDPOINT: "opc.tcp://simulator:4840",
        MQTT_URL: "tcp://mqtt:1883",
        DATA_DIR: /data,
      }
    volumes: [gateway-data:/data]
    depends_on:
      {
        simulator: { condition: service_healthy },
        mqtt: { condition: service_healthy },
      }
    healthcheck:
      {
        test: [CMD-SHELL, "wget -qO- http://localhost:8082/health"],
        interval: 3s,
        timeout: 3s,
        retries: 30,
      }
  simulator-02:
    <<: *simulator
    environment:
      EQUIPMENT_ID: TEL-CVDTIN-08A-02
      CVD_RECOVERY_KEY_FILE: /run/secrets/recovery_key
    volumes: [sim-02-data:/data]
  gateway-02:
    <<: *gateway
    environment:
      EQUIPMENT_ID: TEL-CVDTIN-08A-02
      OPC_ENDPOINT: opc.tcp://simulator-02:4840
      MQTT_URL: tcp://mqtt:1883
      DATA_DIR: /data
    volumes: [gateway-02-data:/data]
    depends_on:
      simulator-02: {condition: service_healthy}
      mqtt: {condition: service_healthy}
  simulator-03:
    <<: *simulator
    environment:
      EQUIPMENT_ID: TEL-CVDTIN-08A-03
